name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  component:
    name: ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: shared
            install: -e "shared[dev]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install CPU PyTorch
        if: matrix.torch
        run: pip install ${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install ${{ matrix.install }}
      - name: Test
        working-directory: ${{ matrix.folder }}
        run: pytest -q
