name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  component:
    name: ${{ matrix.folder }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: shared
            install: -e "shared[dev]"
          - folder: pipeline
            install: -e shared -e "pipeline[dev]"
          - folder: Risk-Compliance
            install: -e shared -e "Risk-Compliance[dev]"
          - folder: Privacy-Integration
            torch: torch==2.5.1 torchvision==0.20.1
            install: -e shared -e "Privacy-Integration[dev]"
          - folder: Utility-Evaluation
            torch: torch torchvision
            install: -e shared -e "Utility-Evaluation[dev]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install CPU PyTorch
        if: matrix.torch
        run: pip install ${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install ${{ matrix.install }}
      - name: Test
        working-directory: ${{ matrix.folder }}
        run: pytest -q

  end-to-end:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install CPU PyTorch
        run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install every component in one environment
        run: >
          pip install -e shared -e "pipeline[dev]" -e Privacy-Integration
          -e Utility-Evaluation -e Risk-Compliance
      - name: Run the whole pipeline on generated data
        working-directory: pipeline
        env:
          R26_E2E: "1"
        run: pytest -q tests/test_end_to_end.py
